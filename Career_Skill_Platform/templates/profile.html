{% extends "layout.html" %}
{% block title %}Student Profile{% endblock %}
{% block content %}
<section class="card">
  <h1>Student Profile</h1>
  <p class="muted">Enter your details and current skills. Separate skill names with commas. For skill levels, use the format <code>Python: beginner, SQL: intermediate</code>.</p>
  <form method="post">
    <label for="name">Full name *</label>
    <input id="name" name="name" required value="{{ student.get('name','') }}">
    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required value="{{ student.get('email','') }}">
    <label for="education">Education</label>
    <input id="education" name="education" value="{{ student.get('education','') }}" placeholder="e.g. MCA, BCA">
    <label for="career">Target career (optional)</label>
    <select id="career" name="career">
      <option value="">Choose later</option>
      {% for c in ['Data Analyst','Python Developer','Web Developer','AI Engineer','Generative AI Developer'] %}
      <option value="{{ c }}" {% if student.get('career','') == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <label for="known_skills">Skills you already know</label>
    <input id="known_skills" name="known_skills" value="{{ student.get('known_skills','') }}" placeholder="Python, SQL, Excel">
    <label for="skill_levels">Skill levels</label>
    <input id="skill_levels" name="skill_levels" value="{{ student.get('skill_levels','') }}" placeholder="Python: beginner, SQL: beginner">
    <button type="submit">Save Profile and Continue</button>
  </form>
</section>
{% endblock %}
